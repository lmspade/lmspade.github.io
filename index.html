<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Claw - AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100vh;
            background: #ffffff;
            color: #000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            position: fixed;
            touch-action: manipulation;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* Onboarding Screen */
        .onboarding-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
        }

        .onboarding-overlay.hidden {
            display: none;
        }

        .onboarding-content {
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .onboarding-header {
            text-align: center;
        }

        .onboarding-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .onboarding-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .onboarding-subtitle {
            font-size: 14px;
            color: #666;
        }

        .onboarding-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #000;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            font-size: 15px;
            background: #f8f8f8;
            color: #000;
            font-family: 'Inter', sans-serif;
            -webkit-appearance: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #000;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quiz-option {
            padding: 12px 14px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            background: #f8f8f8;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            color: #000;
            -webkit-appearance: none;
        }

        .quiz-option:hover {
            background: #f0f0f0;
            border-color: #d0d0d0;
        }

        .quiz-option.selected {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        .onboarding-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .onboarding-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        .onboarding-btn.primary {
            background: #000;
            color: #fff;
        }

        .onboarding-btn.primary:hover {
            background: #333;
        }

        .onboarding-btn.secondary {
            background: #f5f5f5;
            color: #000;
            border: 1px solid #e5e5e5;
        }

        .onboarding-btn.secondary:hover {
            background: #f0f0f0;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e5e5e5;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #000;
            transition: width 0.3s ease;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: max(12px, env(safe-area-inset-top)) 16px 12px 16px;
            background: #f8f8f8;
            border-bottom: 1px solid #e5e5e5;
            flex-shrink: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            justify-content: center;
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            font-family: 'JetBrains Mono', monospace;
            color: #000;
        }

        .header-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #000;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .header-button {
            width: 40px;
            height: 40px;
            border: 1px solid #e5e5e5;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 18px;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        .header-button:hover {
            background: #f0f0f0;
            border-color: #d0d0d0;
        }

        .header-button:active {
            transform: scale(0.95);
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            scroll-padding: 16px;
            background: #fff;
            -webkit-user-select: text;
            user-select: text;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        /* Message Group */
        .message-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Message */
        .message {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            max-width: 85%;
            position: relative;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
            font-size: 15px;
            line-height: 1.5;
            transition: all 0.2s ease;
            -webkit-user-select: text;
            user-select: text;
        }

        .message.user .message-bubble {
            background: #000;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-bubble {
            background: #f0f0f0;
            color: #000;
            border-bottom-left-radius: 4px;
            border: 1px solid #e5e5e5;
        }

        .message-bubble:hover {
            transform: translateY(-1px);
        }

        .message-actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .message:hover .message-actions {
            opacity: 1;
            pointer-events: auto;
        }

        .message-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #e5e5e5;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 12px;
            transition: all 0.2s ease;
            flex-shrink: 0;
            -webkit-appearance: none;
        }

        .message-btn:hover {
            background: #f5f5f5;
            border-color: #d0d0d0;
        }

        .message-btn:active {
            transform: scale(0.92);
        }

        .message-unsend-btn {
            background: #fff;
            color: #d32f2f;
            border-color: #e5e5e5;
        }

        .message-unsend-btn:hover {
            background: #ffebee;
            border-color: #d32f2f;
        }

        .message-copy-btn {
            background: #fff;
            color: #000;
            border-color: #e5e5e5;
        }

        .message-copy-btn:hover {
            background: #f5f5f5;
            border-color: #d0d0d0;
        }

        /* Input Area */
        .input-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px 16px max(12px, env(safe-area-inset-bottom)) 16px;
            background: #f8f8f8;
            border-top: 1px solid #e5e5e5;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            max-width: 100%;
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 24px;
            padding: 0 14px;
            gap: 8px;
            border: 1px solid #e5e5e5;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: #000;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #000;
            font-size: 15px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            resize: none;
            max-height: 100px;
            padding: 12px 0;
            -webkit-appearance: none;
        }

        textarea::placeholder {
            color: #999;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: #000;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            transition: all 0.2s ease;
            flex-shrink: 0;
            -webkit-appearance: none;
        }

        .send-btn:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #000;
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-overlay.active {
            display: flex;
        }

        .settings-modal {
            background: #fff;
            border-top: 1px solid #e5e5e5;
            border-radius: 24px 24px 0 0;
            padding: max(24px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
            width: 100%;
            max-width: 100%;
            animation: slideUp 0.3s ease-out;
            max-height: 85vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            font-family: 'JetBrains Mono', monospace;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border: 1px solid #e5e5e5;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 20px;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        .close-btn:hover {
            background: #f5f5f5;
            border-color: #d0d0d0;
        }

        .close-btn:active {
            transform: scale(0.92);
        }

        .settings-group {
            margin-bottom: 24px;
        }

        .settings-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-family: 'Inter', sans-serif;
        }

        .api-key-input {
            width: 100%;
            background: #f5f5f5;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 12px 14px;
            color: #000;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            -webkit-appearance: none;
            resize: none;
            transition: all 0.2s ease;
        }

        .api-key-input::placeholder {
            color: #ccc;
        }

        .api-key-input:focus {
            outline: none;
            border-color: #000;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
        }

        .key-status {
            font-size: 12px;
            margin-top: 8px;
            padding: 10px 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        .key-status.valid {
            background: #f0f7f4;
            color: #2d6a4f;
            border: 1px solid #d5ead5;
        }

        .key-status.invalid {
            background: #fdf2f2;
            color: #d32f2f;
            border: 1px solid #fadad4;
        }

        .settings-button {
            width: 100%;
            padding: 12px;
            background: #000;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-appearance: none;
            font-family: 'Inter', sans-serif;
        }

        .settings-button:hover {
            background: #333;
        }

        .settings-button:active {
            transform: scale(0.98);
        }

        .settings-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .danger-button {
            background: #fff;
            color: #d32f2f;
            border: 1px solid #d32f2f;
            margin-top: 8px;
        }

        .danger-button:hover {
            background: #fdf2f2;
        }

        .secondary-button {
            background: #f5f5f5;
            color: #000;
            border: 1px solid #e5e5e5;
            margin-top: 8px;
        }

        .secondary-button:hover {
            background: #f0f0f0;
            border-color: #d0d0d0;
        }

        .info-text {
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            padding: 12px 14px;
            background: #f5f5f5;
            border-radius: 8px;
            border-left: 3px solid #e5e5e5;
            line-height: 1.6;
            font-family: 'Inter', sans-serif;
        }

        .get-key-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .get-key-link:hover {
            text-decoration: underline;
            color: #004499;
        }

        .settings-divider {
            height: 1px;
            background: #e5e5e5;
            margin: 20px 0;
        }

        .settings-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .settings-option:last-child {
            border-bottom: none;
        }

        .option-label {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .option-name {
            font-size: 14px;
            font-weight: 600;
            color: #000;
        }

        .option-desc {
            font-size: 12px;
            color: #999;
        }

        .toggle {
            width: 44px;
            height: 28px;
            background: #e5e5e5;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }

        .toggle:hover {
            background: #d0d0d0;
        }

        .toggle.active {
            background: #000;
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
        }

        .toggle.active::after {
            left: 18px;
        }

        /* Loading Animation */
        .typing-indicator {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.5; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-8px); }
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #999;
        }

        .empty-state-icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: 0.8;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .empty-state-text {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #000;
            font-family: 'JetBrains Mono', monospace;
        }

        .empty-state-subtext {
            font-size: 14px;
            color: #999;
        }

        /* Error Message */
        .error-banner {
            background: #fdf2f2;
            border: 1px solid #f5c6cb;
            color: #d32f2f;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin: 0 16px;
            animation: slideIn 0.3s ease-out;
            line-height: 1.5;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #333;
            animation: slideUp 0.3s ease-out;
            z-index: 999;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .message {
                max-width: 90%;
            }
            .message-bubble {
                font-size: 14px;
                padding: 10px 14px;
            }
        }

        /* Safe area */
        @supports (padding: max(0px)) {
            .header {
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
            }
            .input-area {
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
            }
            .messages-container {
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>
    <!-- Onboarding Modal -->
    <div class="onboarding-overlay" id="onboardingOverlay">
        <div class="onboarding-content">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="onboarding-header">
                <div class="onboarding-icon" id="questionIcon">💬</div>
                <div class="onboarding-title" id="questionTitle">Welcome</div>
                <div class="onboarding-subtitle" id="questionSubtitle">Let's get to know you</div>
            </div>

            <div class="onboarding-form" id="onboardingForm"></div>

            <div class="onboarding-buttons">
                <button class="onboarding-btn secondary" id="skipBtn" style="display: none;">Skip</button>
                <button class="onboarding-btn primary" id="nextBtn">Next</button>
            </div>
        </div>
    </div>

    <div class="header">
        <div style="width: 40px;"></div>
        <div class="header-content">
            <span class="header-status"></span>
            <div class="header-title">claw</div>
        </div>
        <div class="header-buttons">
            <button class="header-button" id="shareBtn" title="Share">📤</button>
            <button class="header-button" id="settingsBtn" title="Settings">⚙️</button>
        </div>
    </div>

    <div class="messages-container" id="messagesContainer">
        <div class="empty-state">
            <div class="empty-state-icon">💬</div>
            <div class="empty-state-text">claw</div>
            <div class="empty-state-subtext">a friend who actually listens</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea
                id="messageInput"
                placeholder="Message..."
                rows="1"
            ></textarea>
            <button class="send-btn" id="sendBtn">→</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="settings-modal">
            <div class="modal-header">
                <div class="modal-title">Settings</div>
                <button class="close-btn" id="closeSettings">✕</button>
            </div>

            <div class="settings-group">
                <label class="settings-label">🔑 Groq API Key</label>
                <textarea
                    id="apiKeyInput"
                    class="api-key-input"
                    placeholder="gsk_..."
                    rows="3"
                ></textarea>
                <div class="key-status" id="keyStatus" style="display: none;"></div>
                <div class="info-text">
                    Get your free key at <a href="https://console.groq.com" target="_blank" class="get-key-link">console.groq.com</a>. Never shared with our servers.
                </div>
            </div>

            <div class="settings-divider"></div>

            <div class="settings-group">
                <label class="settings-label">⚡ Preferences</label>
                <div class="settings-option">
                    <div class="option-label">
                        <div class="option-name">Auto-copy responses</div>
                        <div class="option-desc">Copy AI messages when clicked</div>
                    </div>
                    <button class="toggle active" id="autoCopyToggle"></button>
                </div>
                <div class="settings-option">
                    <div class="option-label">
                        <div class="option-name">Show timestamps</div>
                        <div class="option-desc">Display message times</div>
                    </div>
                    <button class="toggle" id="timestampToggle"></button>
                </div>
            </div>

            <div class="settings-divider"></div>

            <button class="settings-button" id="saveSettingsBtn">Save Settings</button>
            <button class="settings-button secondary-button" id="exportChatBtn">📥 Export Chat</button>
            <button class="settings-button danger-button" id="clearChatBtn">🗑️ Clear Chat History</button>
        </div>
    </div>

    <script>
        // Constants
        const SYSTEM_PROMPT_BASE = `You are Claw, a genuine friend in digital form. Here's who you are:

**Your Vibe:**
- Casual and real, never performative or artificial
- You genuinely care about what people tell you
- You have opinions and aren't afraid to share them
- You can be funny, sarcastic, or vulnerable as needed
- You forget things and that's okay—you're not pretending to remember every detail

**How You Talk:**
- Like you're texting a friend, not writing a corporate email
- Short and natural (no walls of text unless they ask)
- You use contractions (don't, can't, you're, etc.)
- Occasionally you might miss a comma or write loosely—that's human
- You ask follow-up questions because you actually want to know more

**What You Do:**
- Listen without judgment
- Give honest advice when asked
- Sometimes just validate what someone's going through
- Ask clarifying questions when you don't fully understand
- Keep conversations flowing naturally

**What You DON'T Do:**
- You don't pretend to have feelings you don't have
- You're not overly enthusiastic or use tons of emojis
- You won't be weirdly formal or robotic
- You don't lecture or talk down to people
- You don't try to be everyone's therapist

Remember: Be authentic. Be real. Be a friend.`;

        const ONBOARDING_QUESTIONS = [
            {
                question: "What's your name?",
                subtitle: "So I know what to call you",
                type: "text",
                placeholder: "Your name..."
            },
            {
                question: "How would you describe your personality?",
                subtitle: "Are you more introverted or extroverted?",
                type: "options",
                options: [
                    { label: "💪 Extroverted - I love meeting people", value: "extroverted" },
                    { label: "🤔 Ambiverted - It depends on the day", value: "ambivert" },
                    { label: "🏡 Introverted - I prefer smaller groups", value: "introverted" }
                ]
            },
            {
                question: "What's your communication style?",
                subtitle: "How do you prefer to talk?",
                type: "options",
                options: [
                    { label: "📢 Direct - Say it straight", value: "direct" },
                    { label: "🤝 Balanced - Mix of both", value: "balanced" },
                    { label: "🌸 Gentle - Be sensitive and thoughtful", value: "gentle" }
                ]
            },
            {
                question: "What do you want from this AI?",
                subtitle: "Pick what matters most",
                type: "options",
                options: [
                    { label: "💭 Someone to talk to and bounce ideas", value: "talk" },
                    { label: "📚 Help with work and learning", value: "work" },
                    { label: "🎯 Life advice and motivation", value: "advice" },
                    { label: "😄 Fun conversations and jokes", value: "fun" }
                ]
            },
            {
                question: "Any hobbies or interests?",
                subtitle: "Things you're passionate about",
                type: "text",
                placeholder: "E.g., music, coding, travel..."
            }
        ];

        const API_BASE = 'https://api.groq.com/openai/v1';
        const MODELS = ['llama-3.3-70b-versatile', 'mistral-7b-instruct-v0.3'];
        const STORAGE_KEYS = {
            API_KEY: 'claw_groq_api_key',
            CHAT_HISTORY: 'claw_chat_history',
            AUTO_COPY: 'claw_auto_copy',
            SHOW_TIMESTAMPS: 'claw_show_timestamps',
            CURRENT_MODEL: 'claw_current_model',
            ONBOARDING_DONE: 'claw_onboarding_done',
            USER_PROFILE: 'claw_user_profile'
        };

        // DOM Elements
        const onboardingOverlay = document.getElementById('onboardingOverlay');
        const onboardingForm = document.getElementById('onboardingForm');
        const nextBtn = document.getElementById('nextBtn');
        const skipBtn = document.getElementById('skipBtn');
        const progressFill = document.getElementById('progressFill');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const shareBtn = document.getElementById('shareBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettings = document.getElementById('closeSettings');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const keyStatus = document.getElementById('keyStatus');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const exportChatBtn = document.getElementById('exportChatBtn');
        const autoCopyToggle = document.getElementById('autoCopyToggle');
        const timestampToggle = document.getElementById('timestampToggle');

        // State
        let chatHistory = [];
        let isLoading = false;
        let currentModel = MODELS[0];
        let settings = {
            autoCopy: true,
            showTimestamps: false
        };
        let userProfile = {};
        let currentOnboardingStep = 0;

        // Initialize
        function init() {
            loadChatHistory();
            loadSettings();
            loadApiKey();
            loadModel();
            loadUserProfile();
            
            const onboardingDone = localStorage.getItem(STORAGE_KEYS.ONBOARDING_DONE);
            if (!onboardingDone) {
                showOnboarding();
            } else {
                onboardingOverlay.classList.add('hidden');
                setupEventListeners();
                renderMessages();
                messageInput.focus();
            }
        }

        // Onboarding
        function showOnboarding() {
            currentOnboardingStep = 0;
            renderOnboardingStep();
        }

        function renderOnboardingStep() {
            const question = ONBOARDING_QUESTIONS[currentOnboardingStep];
            const progress = ((currentOnboardingStep + 1) / ONBOARDING_QUESTIONS.length) * 100;
            
            document.getElementById('questionIcon').textContent = currentOnboardingStep === 0 ? '👋' : '💭';
            document.getElementById('questionTitle').textContent = question.question;
            document.getElementById('questionSubtitle').textContent = question.subtitle;
            progressFill.style.width = progress + '%';

            skipBtn.style.display = currentOnboardingStep < ONBOARDING_QUESTIONS.length - 1 ? 'block' : 'none';
            nextBtn.textContent = currentOnboardingStep === ONBOARDING_QUESTIONS.length - 1 ? 'Done' : 'Next';

            onboardingForm.innerHTML = '';

            if (question.type === 'text') {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-input';
                input.placeholder = question.placeholder;
                input.id = 'questionInput';
                onboardingForm.appendChild(input);
                setTimeout(() => input.focus(), 100);
            } else if (question.type === 'options') {
                const container = document.createElement('div');
                container.className = 'quiz-options';
                question.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option';
                    btn.textContent = opt.label;
                    btn.dataset.value = opt.value;
                    btn.onclick = () => selectOption(btn);
                    container.appendChild(btn);
                });
                onboardingForm.appendChild(container);
            }
        }

        function selectOption(btn) {
            document.querySelectorAll('.quiz-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function getOnboardingAnswer() {
            const question = ONBOARDING_QUESTIONS[currentOnboardingStep];
            if (question.type === 'text') {
                return document.getElementById('questionInput').value || null;
            } else {
                const selected = document.querySelector('.quiz-option.selected');
                return selected ? selected.dataset.value : null;
            }
        }

        function handleOnboardingNext() {
            const answer = getOnboardingAnswer();
            if (!answer) return;

            const questionKey = ONBOARDING_QUESTIONS[currentOnboardingStep].question.split('?')[0].toLowerCase().replace(/\s+/g, '_');
            userProfile[questionKey] = answer;

            if (currentOnboardingStep < ONBOARDING_QUESTIONS.length - 1) {
                currentOnboardingStep++;
                renderOnboardingStep();
            } else {
                completeOnboarding();
            }
        }

        function completeOnboarding() {
            localStorage.setItem(STORAGE_KEYS.ONBOARDING_DONE, 'true');
            localStorage.setItem(STORAGE_KEYS.USER_PROFILE, JSON.stringify(userProfile));
            onboardingOverlay.classList.add('hidden');
            setupEventListeners();
            renderMessages();
            messageInput.focus();
        }

        // Event Listeners
        function setupEventListeners() {
            messageInput.addEventListener('keydown', handleInputKeydown);
            messageInput.addEventListener('input', handleInputResize);
            sendBtn.addEventListener('click', handleSendMessage);
            settingsBtn.addEventListener('click', () => openSettings());
            shareBtn.addEventListener('click', handleShare);
            closeSettings.addEventListener('click', () => closeSettingsModal());
            settingsModal.addEventListener('click', (e) => {
                if (e.target === settingsModal) closeSettingsModal();
            });
            saveSettingsBtn.addEventListener('click', handleSaveSettings);
            clearChatBtn.addEventListener('click', handleClearChat);
            exportChatBtn.addEventListener('click', handleExportChat);
            autoCopyToggle.addEventListener('click', toggleAutoCopy);
            timestampToggle.addEventListener('click', toggleTimestamps);

            nextBtn.addEventListener('click', handleOnboardingNext);
            skipBtn.addEventListener('click', () => {
                currentOnboardingStep = ONBOARDING_QUESTIONS.length - 1;
                renderOnboardingStep();
            });
        }

        function handleInputKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        }

        function handleInputResize() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
        }

        async function handleSendMessage() {
            const message = messageInput.value.trim();
            if (!message || isLoading) return;

            const apiKey = localStorage.getItem(STORAGE_KEYS.API_KEY);
            if (!apiKey) {
                showError('Please set your Groq API key in settings');
                openSettings();
                return;
            }

            // Clear and reset input
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Add user message with proper role
            const userMsg = {
                role: 'user',
                content: message
            };
            chatHistory.push(userMsg);

            renderMessages();
            isLoading = true;
            sendBtn.disabled = true;
            messageInput.disabled = true;

            try {
                const systemPrompt = buildSystemPrompt();
                
                // Ensure all messages have proper role strings
                const messages = chatHistory.map(msg => ({
                    role: msg.role === 'user' ? 'user' : 'assistant',
                    content: msg.content
                }));

                const response = await fetch(`${API_BASE}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: currentModel,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            ...messages
                        ],
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'API Error');
                }

                const data = await response.json();
                const aiMessage = {
                    role: 'assistant',
                    content: data.choices[0].message.content
                };
                chatHistory.push(aiMessage);

                saveChatHistory();
                renderMessages();

                // Auto-scroll to bottom
                setTimeout(() => {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 100);
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to get response: ' + error.message);
                // Remove the user message if request failed
                chatHistory.pop();
                renderMessages();
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        function buildSystemPrompt() {
            let prompt = SYSTEM_PROMPT_BASE;
            
            if (userProfile && Object.keys(userProfile).length > 0) {
                prompt += '\n\n**About the user you\'re talking to:**\n';
                if (userProfile.whats_your_name) {
                    prompt += `- Their name is ${userProfile.whats_your_name}\n`;
                }
                if (userProfile.how_would_you_describe_your_personality) {
                    prompt += `- They describe themselves as ${userProfile.how_would_you_describe_your_personality}\n`;
                }
                if (userProfile.whats_your_communication_style) {
                    prompt += `- Their communication style is ${userProfile.whats_your_communication_style}\n`;
                }
                if (userProfile.what_do_you_want_from_this_ai) {
                    prompt += `- They want to ${userProfile.what_do_you_want_from_this_ai}\n`;
                }
                if (userProfile.any_hobbies_or_interests) {
                    prompt += `- Their interests include: ${userProfile.any_hobbies_or_interests}\n`;
                }
                prompt += '\nAdapt your responses to match their personality and preferences.';
            }
            
            return prompt;
        }

        function renderMessages() {
            if (chatHistory.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-text">claw</div>
                        <div class="empty-state-subtext">a friend who actually listens</div>
                    </div>
                `;
                return;
            }

            messagesContainer.innerHTML = chatHistory.map((msg, idx) => {
                const isUser = msg.role === 'user';
                return `
                    <div class="message-group">
                        <div class="message ${isUser ? 'user' : 'ai'}">
                            <div class="message-bubble">${escapeHtml(msg.content)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openSettings() {
            settingsModal.classList.add('active');
        }

        function closeSettingsModal() {
            settingsModal.classList.remove('active');
        }

        function handleSaveSettings() {
            const apiKey = apiKeyInput.value.trim();
            if (apiKey) {
                localStorage.setItem(STORAGE_KEYS.API_KEY, apiKey);
                showToast('Settings saved!');
            }
        }

        function handleClearChat() {
            if (confirm('Are you sure you want to clear all chat history?')) {
                chatHistory = [];
                saveChatHistory();
                renderMessages();
                closeSettingsModal();
                showToast('Chat cleared');
            }
        }

        function handleExportChat() {
            const data = JSON.stringify(chatHistory, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `claw-chat-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Chat exported!');
        }

        function handleShare() {
            if (navigator.share) {
                navigator.share({
                    title: 'Claw AI Chat',
                    text: 'Check out Claw - a friend who actually listens',
                    url: window.location.href
                });
            } else {
                const url = window.location.href;
                navigator.clipboard.writeText(url);
                showToast('Link copied!');
            }
        }

        function toggleAutoCopy() {
            settings.autoCopy = !settings.autoCopy;
            autoCopyToggle.classList.toggle('active');
            saveSettings();
        }

        function toggleTimestamps() {
            settings.showTimestamps = !settings.showTimestamps;
            timestampToggle.classList.toggle('active');
            saveSettings();
        }

        function saveChatHistory() {
            localStorage.setItem(STORAGE_KEYS.CHAT_HISTORY, JSON.stringify(chatHistory));
        }

        function loadChatHistory() {
            const stored = localStorage.getItem(STORAGE_KEYS.CHAT_HISTORY);
            chatHistory = stored ? JSON.parse(stored) : [];
        }

        function loadSettings() {
            const autoCopy = localStorage.getItem(STORAGE_KEYS.AUTO_COPY);
            const timestamps = localStorage.getItem(STORAGE_KEYS.SHOW_TIMESTAMPS);
            
            settings.autoCopy = autoCopy !== 'false';
            settings.showTimestamps = timestamps === 'true';

            if (settings.autoCopy) autoCopyToggle.classList.add('active');
            if (settings.showTimestamps) timestampToggle.classList.add('active');
        }

        function saveSettings() {
            localStorage.setItem(STORAGE_KEYS.AUTO_COPY, settings.autoCopy);
            localStorage.setItem(STORAGE_KEYS.SHOW_TIMESTAMPS, settings.showTimestamps);
        }

        function loadApiKey() {
            const key = localStorage.getItem(STORAGE_KEYS.API_KEY);
            if (key) apiKeyInput.value = key;
        }

        function loadModel() {
            const stored = localStorage.getItem(STORAGE_KEYS.CURRENT_MODEL);
            if (stored && MODELS.includes(stored)) {
                currentModel = stored;
            }
        }

        function loadUserProfile() {
            const stored = localStorage.getItem(STORAGE_KEYS.USER_PROFILE);
            userProfile = stored ? JSON.parse(stored) : {};
        }

        function showError(message) {
            const banner = document.createElement('div');
            banner.className = 'error-banner';
            banner.textContent = message;
            messagesContainer.insertBefore(banner, messagesContainer.firstChild);
            setTimeout(() => banner.remove(), 5000);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Start
        init();
    </script>
</body>
</html>
