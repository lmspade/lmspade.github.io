<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
    <meta name="theme-color" content="#000000">
    <title>Claw - AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #ffffff;
            color: #000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            position: fixed;
            touch-action: manipulation;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* Onboarding Screen */
        .onboarding-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .onboarding-overlay.hidden {
            display: none;
        }

        .onboarding-content {
            width: 100%;
            height: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow: hidden;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
        }

        .onboarding-scroll {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 20px;
        }

        .onboarding-header {
            text-align: center;
        }

        .onboarding-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .onboarding-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .onboarding-subtitle {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
        }

        .onboarding-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #000;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            font-size: 15px;
            background: #f8f8f8;
            color: #000;
            font-family: 'Inter', sans-serif;
            -webkit-appearance: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #000;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quiz-option {
            padding: 14px 16px;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            background: #f8f8f8;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            color: #000;
            -webkit-appearance: none;
            font-weight: 500;
        }

        .quiz-option:hover {
            background: #f0f0f0;
            border-color: #d0d0d0;
        }

        .quiz-option.selected {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e5e5e5;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #000;
            transition: width 0.3s ease;
        }

        .onboarding-buttons {
            display: flex;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px solid #e5e5e5;
        }

        .onboarding-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        .onboarding-btn.primary {
            background: #000;
            color: #fff;
        }

        .onboarding-btn.primary:hover {
            background: #333;
        }

        .onboarding-btn.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .onboarding-btn.secondary {
            background: #f5f5f5;
            color: #000;
            border: 1px solid #e5e5e5;
        }

        .onboarding-btn.secondary:hover {
            background: #f0f0f0;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: max(12px, env(safe-area-inset-top)) 16px 12px 16px;
            background: #f8f8f8;
            border-bottom: 1px solid #e5e5e5;
            flex-shrink: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            justify-content: center;
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            font-family: 'JetBrains Mono', monospace;
            color: #000;
        }

        .header-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #000;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .header-button {
            width: 40px;
            height: 40px;
            border: 1px solid #e5e5e5;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 18px;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        .header-button:hover {
            background: #f0f0f0;
            border-color: #d0d0d0;
        }

        .header-button:active {
            transform: scale(0.95);
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            scroll-padding: 16px;
            background: #fff;
            -webkit-user-select: text;
            user-select: text;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        /* Message Group */
        .message-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Message */
        .message {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            max-width: 85%;
            position: relative;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
            font-size: 15px;
            line-height: 1.5;
            transition: all 0.2s ease;
            -webkit-user-select: text;
            user-select: text;
        }

        .message.user .message-bubble {
            background: #000;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-bubble {
            background: #f0f0f0;
            color: #000;
            border-bottom-left-radius: 4px;
            border: 1px solid #e5e5e5;
        }

        .message-bubble:hover {
            transform: translateY(-1px);
        }

        /* Input Area */
        .input-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px 16px max(12px, env(safe-area-inset-bottom)) 16px;
            background: #f8f8f8;
            border-top: 1px solid #e5e5e5;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            max-width: 100%;
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 24px;
            padding: 0 14px;
            gap: 8px;
            border: 1px solid #e5e5e5;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: #000;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #000;
            font-size: 15px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            resize: none;
            max-height: 100px;
            padding: 12px 0;
            -webkit-appearance: none;
            -webkit-user-select: text;
            user-select: text;
        }

        textarea::placeholder {
            color: #999;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: #000;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            transition: all 0.2s ease;
            flex-shrink: 0;
            -webkit-appearance: none;
        }

        .send-btn:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #000;
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-overlay.active {
            display: flex;
        }

        .settings-modal {
            background: #fff;
            border-top: 1px solid #e5e5e5;
            border-radius: 24px 24px 0 0;
            padding: max(24px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
            width: 100%;
            max-width: 100%;
            animation: slideUp 0.3s ease-out;
            max-height: 85vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            font-family: 'JetBrains Mono', monospace;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border: 1px solid #e5e5e5;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 20px;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        .close-btn:hover {
            background: #f5f5f5;
            border-color: #d0d0d0;
        }

        .settings-group {
            margin-bottom: 24px;
        }

        .settings-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .api-key-input {
            width: 100%;
            background: #f5f5f5;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 12px 14px;
            color: #000;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            -webkit-appearance: none;
            resize: none;
            transition: all 0.2s ease;
        }

        .api-key-input:focus {
            outline: none;
            border-color: #000;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
        }

        .settings-button {
            width: 100%;
            padding: 12px;
            background: #000;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        .settings-button:hover {
            background: #333;
        }

        .settings-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .danger-button {
            background: #fff;
            color: #d32f2f;
            border: 1px solid #d32f2f;
            margin-top: 8px;
        }

        .secondary-button {
            background: #f5f5f5;
            color: #000;
            border: 1px solid #e5e5e5;
            margin-top: 8px;
        }

        .info-text {
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            padding: 12px 14px;
            background: #f5f5f5;
            border-radius: 8px;
            border-left: 3px solid #e5e5e5;
            line-height: 1.6;
        }

        .get-key-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
        }

        .settings-divider {
            height: 1px;
            background: #e5e5e5;
            margin: 20px 0;
        }

        .settings-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .option-label {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .option-name {
            font-size: 14px;
            font-weight: 600;
            color: #000;
        }

        .option-desc {
            font-size: 12px;
            color: #999;
        }

        .toggle {
            width: 44px;
            height: 28px;
            background: #e5e5e5;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }

        .toggle.active {
            background: #000;
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
        }

        .toggle.active::after {
            left: 18px;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #999;
        }

        .empty-state-icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .empty-state-text {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #000;
            font-family: 'JetBrains Mono', monospace;
        }

        .empty-state-subtext {
            font-size: 14px;
            color: #999;
        }

        .error-banner {
            background: #fdf2f2;
            border: 1px solid #f5c6cb;
            color: #d32f2f;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin: 0 16px;
            line-height: 1.5;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #333;
            z-index: 999;
        }

        @media (max-width: 400px) {
            .message {
                max-width: 90%;
            }
        }

        @supports (padding: max(0px)) {
            .header {
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
            }
            .input-area {
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
            }
            .messages-container {
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>
    <!-- Onboarding Modal -->
    <div class="onboarding-overlay" id="onboardingOverlay">
        <div class="onboarding-content">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="onboarding-scroll">
                <div class="onboarding-header">
                    <div class="onboarding-icon" id="questionIcon">💬</div>
                    <div class="onboarding-title" id="questionTitle">Welcome</div>
                    <div class="onboarding-subtitle" id="questionSubtitle">Let's get to know you</div>
                </div>

                <div class="onboarding-form" id="onboardingForm"></div>
            </div>

            <div class="onboarding-buttons">
                <button class="onboarding-btn secondary" id="skipBtn" style="display: none;">Skip</button>
                <button class="onboarding-btn primary" id="nextBtn">Next</button>
            </div>
        </div>
    </div>

    <div class="header">
        <div style="width: 40px;"></div>
        <div class="header-content">
            <span class="header-status"></span>
            <div class="header-title">claw</div>
        </div>
        <div class="header-buttons">
            <button class="header-button" id="shareBtn" title="Share">📤</button>
            <button class="header-button" id="settingsBtn" title="Settings">⚙️</button>
        </div>
    </div>

    <div class="messages-container" id="messagesContainer">
        <div class="empty-state">
            <div class="empty-state-icon">💬</div>
            <div class="empty-state-text">claw</div>
            <div class="empty-state-subtext">a friend who actually listens</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea
                id="messageInput"
                placeholder="Message..."
                rows="1"
            ></textarea>
            <button class="send-btn" id="sendBtn">→</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="settings-modal">
            <div class="modal-header">
                <div class="modal-title">Settings</div>
                <button class="close-btn" id="closeSettings">✕</button>
            </div>

            <div class="settings-group">
                <label class="settings-label">🔑 Groq API Key</label>
                <textarea
                    id="apiKeyInput"
                    class="api-key-input"
                    placeholder="gsk_..."
                    rows="3"
                ></textarea>
                <div class="info-text">
                    Get your free key at <a href="https://console.groq.com" target="_blank" class="get-key-link">console.groq.com</a>
                </div>
            </div>

            <div class="settings-divider"></div>

            <button class="settings-button" id="saveSettingsBtn">Save Settings</button>
            <button class="settings-button secondary-button" id="exportChatBtn">📥 Export Chat</button>
            <button class="settings-button danger-button" id="clearChatBtn">🗑️ Clear Chat</button>
        </div>
    </div>

    <script>
        const SYSTEM_PROMPT_BASE = `You are Claw, a genuine friend in digital form. Here's who you are:

**Your Vibe:**
- Casual and real, never performative or artificial
- You genuinely care about what people tell you
- You have opinions and aren't afraid to share them
- You can be funny, sarcastic, or vulnerable as needed

**How You Talk:**
- Like you're texting a friend, not a corporate email
- Short and natural (no walls of text unless they ask)
- You use contractions (don't, can't, you're, etc.)
- You ask follow-up questions because you actually want to know more

**What You Do:**
- Listen without judgment
- Give honest advice when asked
- Validate what someone's going through
- Keep conversations flowing naturally

Remember: Be authentic. Be real. Be a friend.`;

        const ONBOARDING_QUESTIONS = [
            {
                question: "What's your name?",
                subtitle: "So I know what to call you",
                type: "text",
                placeholder: "Enter your name..."
            },
            {
                question: "How would you describe your personality?",
                subtitle: "Choose what resonates most",
                type: "options",
                options: [
                    { label: "💪 Extroverted - I love being around people", value: "extroverted" },
                    { label: "⚖️ Ambivert - It depends on my mood", value: "ambivert" },
                    { label: "🏡 Introverted - I recharge alone", value: "introverted" }
                ]
            },
            {
                question: "What's your communication style?",
                subtitle: "How do you prefer to have conversations?",
                type: "options",
                options: [
                    { label: "📢 Direct & honest - don't sugarcoat", value: "direct" },
                    { label: "🤝 Balanced - straightforward but kind", value: "balanced" },
                    { label: "🌸 Gentle & thoughtful - be sensitive", value: "gentle" }
                ]
            },
            {
                question: "What vibe are you looking for?",
                subtitle: "What should my personality lean towards?",
                type: "options",
                options: [
                    { label: "😄 Funny & entertaining", value: "funny" },
                    { label: "🧠 Thoughtful & deep", value: "thoughtful" },
                    { label: "💪 Motivating & inspiring", value: "motivating" },
                    { label: "😌 Chill & casual", value: "chill" }
                ]
            },
            {
                question: "What do you want from this AI?",
                subtitle: "What's most important to you?",
                type: "options",
                options: [
                    { label: "💭 Someone to vent & talk to", value: "talk" },
                    { label: "📚 Help with work & learning", value: "work" },
                    { label: "🎯 Life advice & perspective", value: "advice" },
                    { label: "🎨 Creative ideas & inspiration", value: "creative" }
                ]
            },
            {
                question: "What are your main interests?",
                subtitle: "Things you're passionate about",
                type: "text",
                placeholder: "E.g., music, coding, art, fitness..."
            },
            {
                question: "How are you feeling today?",
                subtitle: "What's your general mood?",
                type: "options",
                options: [
                    { label: "😊 Good - ready to chat", value: "good" },
                    { label: "😌 Neutral - just here", value: "neutral" },
                    { label: "😔 Not great - need support", value: "down" },
                    { label: "😤 Frustrated - need to vent", value: "frustrated" }
                ]
            },
            {
                question: "How often do you want me to use humor?",
                subtitle: "Pick your vibe",
                type: "options",
                options: [
                    { label: "😂 Lots - keep me laughing", value: "lots" },
                    { label: "🤨 Some - mix it in", value: "some" },
                    { label: "⚖️ Balanced - it depends", value: "balanced" },
                    { label: "😐 Little - stay serious", value: "little" }
                ]
            },
            {
                question: "What shouldn't I do?",
                subtitle: "Things to avoid",
                type: "options",
                options: [
                    { label: "🤐 Don't be boring", value: "boring" },
                    { label: "📋 Don't give corporate advice", value: "corporate" },
                    { label: "🚫 Don't preach or lecture", value: "preach" },
                    { label: "😅 Don't try too hard", value: "tryhardx" }
                ]
            }
        ];

        const API_BASE = 'https://api.groq.com/openai/v1';
        const MODELS = ['llama-3.3-70b-versatile', 'mistral-7b-instruct-v0.3'];
        const STORAGE_KEYS = {
            API_KEY: 'claw_groq_api_key',
            CHAT_HISTORY: 'claw_chat_history',
            ONBOARDING_DONE: 'claw_onboarding_done',
            USER_PROFILE: 'claw_user_profile'
        };

        // DOM Elements
        const onboardingOverlay = document.getElementById('onboardingOverlay');
        const onboardingForm = document.getElementById('onboardingForm');
        const nextBtn = document.getElementById('nextBtn');
        const skipBtn = document.getElementById('skipBtn');
        const progressFill = document.getElementById('progressFill');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const shareBtn = document.getElementById('shareBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettings = document.getElementById('closeSettings');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const exportChatBtn = document.getElementById('exportChatBtn');

        // State
        let chatHistory = [];
        let isLoading = false;
        let currentModel = MODELS[0];
        let userProfile = {};
        let currentOnboardingStep = 0;

        function init() {
            loadChatHistory();
            loadApiKey();
            loadUserProfile();
            
            const onboardingDone = localStorage.getItem(STORAGE_KEYS.ONBOARDING_DONE);
            if (!onboardingDone) {
                showOnboarding();
            } else {
                onboardingOverlay.classList.add('hidden');
                setupMainListeners();
                renderMessages();
                messageInput.focus();
            }
        }

        function showOnboarding() {
            currentOnboardingStep = 0;
            setupOnboardingListeners();
            renderOnboardingStep();
        }

        function setupOnboardingListeners() {
            nextBtn.onclick = handleOnboardingNext;
            skipBtn.onclick = () => {
                currentOnboardingStep = ONBOARDING_QUESTIONS.length - 1;
                renderOnboardingStep();
            };
        }

        function renderOnboardingStep() {
            const question = ONBOARDING_QUESTIONS[currentOnboardingStep];
            const progress = ((currentOnboardingStep + 1) / ONBOARDING_QUESTIONS.length) * 100;
            
            document.getElementById('questionIcon').textContent = currentOnboardingStep === 0 ? '👋' : '❓';
            document.getElementById('questionTitle').textContent = question.question;
            document.getElementById('questionSubtitle').textContent = question.subtitle;
            progressFill.style.width = progress + '%';

            skipBtn.style.display = currentOnboardingStep < ONBOARDING_QUESTIONS.length - 1 ? 'block' : 'none';
            nextBtn.textContent = currentOnboardingStep === ONBOARDING_QUESTIONS.length - 1 ? 'Start Chatting' : 'Next';
            nextBtn.disabled = false;

            onboardingForm.innerHTML = '';

            if (question.type === 'text') {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-input';
                input.placeholder = question.placeholder;
                input.id = 'questionInput';
                onboardingForm.appendChild(input);
                setTimeout(() => input.focus(), 100);
            } else if (question.type === 'options') {
                const container = document.createElement('div');
                container.className = 'quiz-options';
                question.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option';
                    btn.textContent = opt.label;
                    btn.dataset.value = opt.value;
                    btn.type = 'button';
                    btn.onclick = () => selectOption(btn);
                    container.appendChild(btn);
                });
                onboardingForm.appendChild(container);
            }
        }

        function selectOption(btn) {
            document.querySelectorAll('.quiz-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function getOnboardingAnswer() {
            const question = ONBOARDING_QUESTIONS[currentOnboardingStep];
            if (question.type === 'text') {
                const val = document.getElementById('questionInput')?.value || '';
                return val.trim() || null;
            } else {
                const selected = document.querySelector('.quiz-option.selected');
                return selected ? selected.dataset.value : null;
            }
        }

        function handleOnboardingNext() {
            const answer = getOnboardingAnswer();
            if (!answer) {
                nextBtn.disabled = true;
                setTimeout(() => nextBtn.disabled = false, 300);
                return;
            }

            const questionKey = ONBOARDING_QUESTIONS[currentOnboardingStep].question.split('?')[0].toLowerCase().replace(/\s+/g, '_');
            userProfile[questionKey] = answer;

            if (currentOnboardingStep < ONBOARDING_QUESTIONS.length - 1) {
                currentOnboardingStep++;
                renderOnboardingStep();
            } else {
                completeOnboarding();
            }
        }

        function completeOnboarding() {
            localStorage.setItem(STORAGE_KEYS.ONBOARDING_DONE, 'true');
            localStorage.setItem(STORAGE_KEYS.USER_PROFILE, JSON.stringify(userProfile));
            onboardingOverlay.classList.add('hidden');
            setupMainListeners();
            renderMessages();
            messageInput.focus();
        }

        function setupMainListeners() {
            messageInput.addEventListener('keydown', handleInputKeydown);
            messageInput.addEventListener('input', handleInputResize);
            sendBtn.addEventListener('click', handleSendMessage);
            settingsBtn.addEventListener('click', () => openSettings());
            shareBtn.addEventListener('click', handleShare);
            closeSettings.addEventListener('click', () => closeSettingsModal());
            settingsModal.addEventListener('click', (e) => {
                if (e.target === settingsModal) closeSettingsModal();
            });
            saveSettingsBtn.addEventListener('click', handleSaveSettings);
            clearChatBtn.addEventListener('click', handleClearChat);
            exportChatBtn.addEventListener('click', handleExportChat);
        }

        function handleInputKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        }

        function handleInputResize() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
        }

        async function handleSendMessage() {
            const message = messageInput.value.trim();
            if (!message || isLoading) return;

            const apiKey = localStorage.getItem(STORAGE_KEYS.API_KEY);
            if (!apiKey) {
                showError('Please set your Groq API key in settings');
                openSettings();
                return;
            }

            messageInput.value = '';
            messageInput.style.height = 'auto';

            chatHistory.push({ role: 'user', content: message });
            renderMessages();
            isLoading = true;
            sendBtn.disabled = true;
            messageInput.disabled = true;

            try {
                const systemPrompt = buildSystemPrompt();
                const messages = chatHistory.map(msg => ({
                    role: msg.role === 'user' ? 'user' : 'assistant',
                    content: msg.content
                }));

                const response = await fetch(`${API_BASE}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: currentModel,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            ...messages
                        ],
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'API Error');
                }

                const data = await response.json();
                chatHistory.push({ role: 'assistant', content: data.choices[0].message.content });

                saveChatHistory();
                renderMessages();
                setTimeout(() => messagesContainer.scrollTop = messagesContainer.scrollHeight, 100);
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to get response: ' + error.message);
                chatHistory.pop();
                renderMessages();
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        function buildSystemPrompt() {
            let prompt = SYSTEM_PROMPT_BASE;
            
            if (userProfile && Object.keys(userProfile).length > 0) {
                prompt += '\n\n**User Profile:**\n';
                if (userProfile.whats_your_name) prompt += `- Name: ${userProfile.whats_your_name}\n`;
                if (userProfile.how_would_you_describe_your_personality) prompt += `- Personality: ${userProfile.how_would_you_describe_your_personality}\n`;
                if (userProfile.whats_your_communication_style) prompt += `- Communication: ${userProfile.whats_your_communication_style}\n`;
                if (userProfile.what_vibe_are_you_looking_for) prompt += `- Preferred vibe: ${userProfile.what_vibe_are_you_looking_for}\n`;
                if (userProfile.what_do_you_want_from_this_ai) prompt += `- They want: ${userProfile.what_do_you_want_from_this_ai}\n`;
                if (userProfile.what_are_your_main_interests) prompt += `- Interests: ${userProfile.what_are_your_main_interests}\n`;
                if (userProfile.how_are_you_feeling_today) prompt += `- Current mood: ${userProfile.how_are_you_feeling_today}\n`;
                if (userProfile.how_often_do_you_want_me_to_use_humor) prompt += `- Humor preference: ${userProfile.how_often_do_you_want_me_to_use_humor}\n`;
                if (userProfile.what_shouldnt_i_do) prompt += `- Avoid: ${userProfile.what_shouldnt_i_do}\n`;
                prompt += '\nTailor responses to match this profile.';
            }
            
            return prompt;
        }

        function renderMessages() {
            if (chatHistory.length === 0) {
                messagesContainer.innerHTML = `<div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-text">claw</div><div class="empty-state-subtext">a friend who actually listens</div></div>`;
                return;
            }
            messagesContainer.innerHTML = chatHistory.map(msg => {
                const isUser = msg.role === 'user';
                return `<div class="message-group"><div class="message ${isUser ? 'user' : 'ai'}"><div class="message-bubble">${escapeHtml(msg.content)}</div></div></div>`;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openSettings() {
            settingsModal.classList.add('active');
        }

        function closeSettingsModal() {
            settingsModal.classList.remove('active');
        }

        function handleSaveSettings() {
            const apiKey = apiKeyInput.value.trim();
            if (apiKey) {
                localStorage.setItem(STORAGE_KEYS.API_KEY, apiKey);
                showToast('Settings saved!');
            }
        }

        function handleClearChat() {
            if (confirm('Clear all messages?')) {
                chatHistory = [];
                saveChatHistory();
                renderMessages();
                closeSettingsModal();
                showToast('Chat cleared');
            }
        }

        function handleExportChat() {
            const data = JSON.stringify(chatHistory, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `claw-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Exported!');
        }

        function handleShare() {
            if (navigator.share) {
                navigator.share({ title: 'Claw', text: 'A friend who actually listens', url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                showToast('Link copied!');
            }
        }

        function saveChatHistory() {
            localStorage.setItem(STORAGE_KEYS.CHAT_HISTORY, JSON.stringify(chatHistory));
        }

        function loadChatHistory() {
            const stored = localStorage.getItem(STORAGE_KEYS.CHAT_HISTORY);
            chatHistory = stored ? JSON.parse(stored) : [];
        }

        function loadApiKey() {
            const key = localStorage.getItem(STORAGE_KEYS.API_KEY);
            if (key) apiKeyInput.value = key;
        }

        function loadUserProfile() {
            const stored = localStorage.getItem(STORAGE_KEYS.USER_PROFILE);
            userProfile = stored ? JSON.parse(stored) : {};
        }

        function showError(message) {
            const banner = document.createElement('div');
            banner.className = 'error-banner';
            banner.textContent = message;
            messagesContainer.insertBefore(banner, messagesContainer.firstChild);
            setTimeout(() => banner.remove(), 5000);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        init();
    </script>
</body>
</html>
