<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
    <meta name="theme-color" content="#0a0e27">
    <title>Clarity - Your Recovery Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1428 100%);
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: fixed;
            touch-action: manipulation;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* Starfield Background */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 10px, #fff, rgba(0,0,0,0));
            background-size: 200px 200px;
            background-repeat: repeat;
            pointer-events: none;
            z-index: 0;
            animation: twinkle 3s ease-in-out infinite;
            opacity: 0.5;
        }

        main {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Onboarding */
        .onboarding-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
        }

        .onboarding-screen.hidden {
            display: none;
        }

        .onboarding-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .onboarding-scroll {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 20px;
        }

        .onboarding-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .onboarding-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .onboarding-header {
            text-align: center;
        }

        .onboarding-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .onboarding-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Space Grotesk', sans-serif;
        }

        .onboarding-subtitle {
            font-size: 15px;
            color: #888;
            line-height: 1.5;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            transition: width 0.4s ease;
        }

        .onboarding-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quiz-option {
            padding: 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            font-weight: 500;
            -webkit-appearance: none;
            text-align: left;
            backdrop-filter: blur(10px);
        }

        .quiz-option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .quiz-option.selected {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 8px 24px rgba(96, 165, 250, 0.3);
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: #e0e0e0;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            -webkit-appearance: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .form-input:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(255, 255, 255, 0.08);
        }

        .form-input::placeholder {
            color: #666;
        }

        .onboarding-buttons {
            display: flex;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .onboarding-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }

        .onboarding-btn.primary {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            color: #fff;
            box-shadow: 0 8px 24px rgba(96, 165, 250, 0.3);
        }

        .onboarding-btn.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .onboarding-btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #888;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Dashboard */
        .dashboard {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .dashboard.active {
            display: flex;
        }

        .dashboard-header {
            padding: max(16px, env(safe-area-inset-top)) 20px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .dashboard-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Space Grotesk', sans-serif;
        }

        .dashboard-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
        }

        .dashboard-content::-webkit-scrollbar {
            width: 4px;
        }

        .dashboard-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        /* Orb Container */
        .orb-container {
            display: flex;
            justify-content: center;
            padding: 30px 0;
        }

        .orb {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.8), rgba(167, 139, 250, 0.8));
            box-shadow: 
                0 0 40px rgba(96, 165, 250, 0.4),
                0 0 80px rgba(167, 139, 250, 0.2),
                inset -20px -20px 40px rgba(0, 0, 0, 0.3),
                inset 20px 20px 40px rgba(255, 255, 255, 0.1);
            animation: orbPulse 3s ease-in-out infinite;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orb.stage-1 {
            background: linear-gradient(135deg, rgba(251, 146, 60, 0.8), rgba(249, 115, 22, 0.8));
            box-shadow: 0 0 40px rgba(251, 146, 60, 0.4);
        }

        .orb.stage-2 {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.8), rgba(22, 163, 74, 0.8));
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.4);
        }

        .orb.stage-3 {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.8), rgba(109, 40, 217, 0.8));
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.4);
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .orb-text {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            backdrop-filter: blur(20px);
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
        }

        .stat-unit {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        /* Progress Section */
        .progress-section {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            backdrop-filter: blur(20px);
        }

        .progress-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #e0e0e0;
        }

        .week-tracker {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-dot {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: all 0.3s ease;
        }

        .day-dot.completed {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            border-color: transparent;
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.5);
        }

        .day-dot.today {
            border-color: #60a5fa;
        }

        /* Panic Button */
        .panic-button {
            width: 100%;
            padding: 18px 20px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
        }

        .panic-button:active {
            transform: scale(0.98);
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            gap: 0;
            padding: 12px 0 max(12px, env(safe-area-inset-bottom)) 0;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }

        .nav-item.active {
            color: #60a5fa;
        }

        .nav-icon {
            font-size: 24px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            display: none;
            align-items: flex-end;
            z-index: 2000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 100%;
            background: linear-gradient(135deg, #1a1f3a, #0f1428);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px 20px 0 0;
            padding: 24px 20px max(20px, env(safe-area-inset-bottom));
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 24px;
            -webkit-appearance: none;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #e0e0e0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            -webkit-appearance: none;
            font-family: 'Inter', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            transition: all 0.3s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Notification Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 20px;
            right: 20px;
            padding: 14px 16px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            color: #fff;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            animation: slideUp 0.3s ease;
            z-index: 2500;
            box-shadow: 0 8px 24px rgba(96, 165, 250, 0.3);
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 400px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        @supports (padding: max(0px)) {
            .dashboard-content {
                padding-left: max(20px, env(safe-area-inset-left));
                padding-right: max(20px, env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>
    <!-- Onboarding -->
    <div class="onboarding-screen" id="onboarding">
        <div class="onboarding-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="onboarding-scroll">
                <div class="onboarding-header">
                    <div class="onboarding-icon" id="onboardingIcon">🌱</div>
                    <div class="onboarding-title" id="onboardingTitle">Welcome</div>
                    <div class="onboarding-subtitle" id="onboardingSubtitle">Your journey starts here</div>
                </div>
                <div class="onboarding-form" id="onboardingForm"></div>
            </div>

            <div class="onboarding-buttons">
                <button class="onboarding-btn secondary" id="skipBtn" style="display: none;">Skip</button>
                <button class="onboarding-btn primary" id="nextBtn">Next</button>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <main>
        <div class="dashboard active" id="dashboard">
            <div class="dashboard-header">
                <div class="dashboard-title">Clarity</div>
            </div>

            <div class="dashboard-content" id="dashboardContent">
                <div class="orb-container">
                    <div class="orb" id="seedOrb">
                        <div class="orb-text">
                            <div id="streakDays" style="font-size: 20px; font-weight: 700;">0</div>
                            <div>days free</div>
                        </div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Current Streak</div>
                        <div class="stat-value" id="streakDisplay">0</div>
                        <div class="stat-unit">days</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Longest Streak</div>
                        <div class="stat-value" id="longestDisplay">0</div>
                        <div class="stat-unit">days</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Days</div>
                        <div class="stat-value" id="totalDisplay">0</div>
                        <div class="stat-unit">tracked</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Recovery Level</div>
                        <div class="stat-value" id="levelDisplay">1</div>
                        <div class="stat-unit">stage</div>
                    </div>
                </div>

                <div class="progress-section">
                    <div class="progress-title">This Week</div>
                    <div class="week-tracker" id="weekTracker"></div>
                </div>

                <button class="panic-button" id="panicBtn">🆘 I Need Help Now</button>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" data-tab="dashboard" id="navDashboard">
            <div class="nav-icon">📊</div>
            <div>Progress</div>
        </button>
        <button class="nav-item" data-tab="resources" id="navResources">
            <div class="nav-icon">🎯</div>
            <div>Resources</div>
        </button>
        <button class="nav-item" data-tab="notifications" id="navNotifications">
            <div class="nav-icon">🔔</div>
            <div>Reminders</div>
        </button>
        <button class="nav-item" data-tab="settings" id="navSettings">
            <div class="nav-icon">⚙️</div>
            <div>Settings</div>
        </button>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Settings</div>
                <button class="close-btn" id="closeSettings">✕</button>
            </div>

            <div class="form-group">
                <label class="form-label">Addiction Type</label>
                <select class="form-control" id="addictionType">
                    <option>Select addiction</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Start Date</label>
                <input type="date" class="form-control" id="startDate">
            </div>

            <button class="btn-primary" id="saveSettingsBtn">Save</button>
        </div>
    </div>

    <!-- Notifications Modal -->
    <div class="modal-overlay" id="notificationsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Daily Reminders</div>
                <button class="close-btn" id="closeNotifications">✕</button>
            </div>

            <div class="form-group">
                <label class="form-label">Enable Reminders</label>
                <input type="checkbox" id="enableReminders" style="width: 20px; height: 20px;">
            </div>

            <div class="form-group">
                <label class="form-label">Reminder Time</label>
                <input type="time" class="form-control" id="reminderTime" value="09:00">
            </div>

            <div class="form-group">
                <label class="form-label">Custom Message</label>
                <textarea class="form-control" id="reminderMessage" placeholder="Your daily motivation..." style="min-height: 100px; font-family: 'Inter', sans-serif; resize: none;"></textarea>
            </div>

            <button class="btn-primary" id="saveRemindersBtn">Save</button>
        </div>
    </div>

    <script>
        // Constants
        const ADDICTIONS = [
            { id: 'alcohol', name: 'Alcohol' },
            { id: 'smoking', name: 'Smoking' },
            { id: 'drugs', name: 'Substance Use' },
            { id: 'gaming', name: 'Gaming' },
            { id: 'porn', name: 'Adult Content' },
            { id: 'social-media', name: 'Social Media' },
            { id: 'sugar', name: 'Sugar/Food' },
            { id: 'caffeine', name: 'Caffeine' },
            { id: 'shopping', name: 'Shopping' },
            { id: 'other', name: 'Other' }
        ];

        const ONBOARDING_QUESTIONS = [
            {
                question: "What brought you here?",
                subtitle: "Choose what you're working to overcome",
                type: "single",
                options: ADDICTIONS.map(a => ({ label: a.name, value: a.id }))
            },
            {
                question: "How long have you been struggling?",
                subtitle: "This helps us understand your journey",
                type: "single",
                options: [
                    { label: "Less than 3 months", value: "0-3" },
                    { label: "3-6 months", value: "3-6" },
                    { label: "6-12 months", value: "6-12" },
                    { label: "Over a year", value: "1+" }
                ]
            },
            {
                question: "What's your biggest trigger?",
                subtitle: "Understanding triggers helps us support you",
                type: "single",
                options: [
                    { label: "Stress & anxiety", value: "stress" },
                    { label: "Boredom", value: "boredom" },
                    { label: "Social situations", value: "social" },
                    { label: "Emotional pain", value: "emotion" },
                    { label: "Habit/routine", value: "habit" },
                    { label: "Other", value: "other" }
                ]
            },
            {
                question: "Why do you want to recover?",
                subtitle: "Your 'why' is your strongest motivation",
                type: "text",
                placeholder: "E.g., for my health, my family, my dreams..."
            },
            {
                question: "How often do you want reminders?",
                subtitle: "We'll check in with you",
                type: "single",
                options: [
                    { label: "Daily at a specific time", value: "daily" },
                    { label: "Multiple times a day", value: "multiple" },
                    { label: "Only when I need help", value: "urgent" },
                    { label: "No reminders", value: "none" }
                ]
            }
        ];

        const STORAGE_KEYS = {
            ONBOARDING_DONE: 'clarity_onboarding_done',
            USER_PROFILE: 'clarity_user_profile',
            STREAK_DATA: 'clarity_streak_data',
            REMINDERS: 'clarity_reminders'
        };

        // DOM
        const onboardingScreen = document.getElementById('onboarding');
        const nextBtn = document.getElementById('nextBtn');
        const skipBtn = document.getElementById('skipBtn');
        const onboardingForm = document.getElementById('onboardingForm');
        const progressFill = document.getElementById('progressFill');
        const seedOrb = document.getElementById('seedOrb');
        const panicBtn = document.getElementById('panicBtn');
        const dashboard = document.getElementById('dashboard');
        const dashboardContent = document.getElementById('dashboardContent');

        // State
        let currentStep = 0;
        let userProfile = {};
        let streakData = { startDate: null, currentStreak: 0, longestStreak: 0, totalDays: 0 };

        function init() {
            loadData();
            const onboardingDone = localStorage.getItem(STORAGE_KEYS.ONBOARDING_DONE);
            
            if (!onboardingDone) {
                showOnboarding();
            } else {
                onboardingScreen.classList.add('hidden');
                dashboard.classList.add('active');
                setupListeners();
                updateDashboard();
            }
        }

        function showOnboarding() {
            currentStep = 0;
            renderOnboardingStep();
            setupOnboardingListeners();
        }

        function renderOnboardingStep() {
            const q = ONBOARDING_QUESTIONS[currentStep];
            const progress = ((currentStep + 1) / ONBOARDING_QUESTIONS.length) * 100;

            document.getElementById('onboardingIcon').textContent = ['🌱', '📈', '⚠️', '💪', '🔔'][currentStep] || '❓';
            document.getElementById('onboardingTitle').textContent = q.question;
            document.getElementById('onboardingSubtitle').textContent = q.subtitle;
            progressFill.style.width = progress + '%';

            skipBtn.style.display = currentStep < ONBOARDING_QUESTIONS.length - 1 ? 'flex' : 'none';
            nextBtn.textContent = currentStep === ONBOARDING_QUESTIONS.length - 1 ? 'Start My Journey' : 'Next';
            nextBtn.disabled = false;

            onboardingForm.innerHTML = '';

            if (q.type === 'text') {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-input';
                input.placeholder = q.placeholder;
                input.id = 'textInput';
                onboardingForm.appendChild(input);
                setTimeout(() => input.focus(), 100);
            } else if (q.type === 'single') {
                const container = document.createElement('div');
                container.className = 'quiz-options';
                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option';
                    btn.textContent = opt.label;
                    btn.dataset.value = opt.value;
                    btn.type = 'button';
                    btn.onclick = () => selectOption(btn);
                    container.appendChild(btn);
                });
                onboardingForm.appendChild(container);
            }
        }

        function selectOption(btn) {
            document.querySelectorAll('.quiz-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function getAnswer() {
            const q = ONBOARDING_QUESTIONS[currentStep];
            if (q.type === 'text') {
                return document.getElementById('textInput')?.value.trim() || null;
            } else {
                return document.querySelector('.quiz-option.selected')?.dataset.value || null;
            }
        }

        function setupOnboardingListeners() {
            nextBtn.onclick = () => {
                const answer = getAnswer();
                if (!answer) return;

                const key = ONBOARDING_QUESTIONS[currentStep].question.split('?')[0].toLowerCase().replace(/\s+/g, '_');
                userProfile[key] = answer;

                if (currentStep < ONBOARDING_QUESTIONS.length - 1) {
                    currentStep++;
                    renderOnboardingStep();
                } else {
                    completeOnboarding();
                }
            };

            skipBtn.onclick = () => {
                currentStep = ONBOARDING_QUESTIONS.length - 1;
                renderOnboardingStep();
            };
        }

        function completeOnboarding() {
            localStorage.setItem(STORAGE_KEYS.ONBOARDING_DONE, 'true');
            localStorage.setItem(STORAGE_KEYS.USER_PROFILE, JSON.stringify(userProfile));
            streakData.startDate = new Date().toISOString();
            localStorage.setItem(STORAGE_KEYS.STREAK_DATA, JSON.stringify(streakData));
            onboardingScreen.classList.add('hidden');
            setupListeners();
            updateDashboard();
            showToast('Welcome to your recovery journey! 🌱');
        }

        function setupListeners() {
            document.getElementById('navDashboard').onclick = () => switchTab('dashboard');
            document.getElementById('navSettings').onclick = () => switchTab('settings');
            document.getElementById('navNotifications').onclick = () => switchTab('notifications');
            document.getElementById('navResources').onclick = () => switchTab('resources');

            document.getElementById('closeSettings').onclick = () => document.getElementById('settingsModal').classList.remove('active');
            document.getElementById('closeNotifications').onclick = () => document.getElementById('notificationsModal').classList.remove('active');

            document.getElementById('saveSettingsBtn').onclick = saveSettings;
            document.getElementById('saveRemindersBtn').onclick = saveReminders;

            panicBtn.onclick = handlePanic;

            ADDICTIONS.forEach(a => {
                const option = document.createElement('option');
                option.value = a.id;
                option.textContent = a.name;
                document.getElementById('addictionType').appendChild(option);
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');

            if (tab === 'settings') {
                document.getElementById('settingsModal').classList.add('active');
            } else if (tab === 'notifications') {
                document.getElementById('notificationsModal').classList.add('active');
            }
        }

        function updateDashboard() {
            const now = new Date();
            const start = streakData.startDate ? new Date(streakData.startDate) : now;
            const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));

            streakData.currentStreak = diff;
            streakData.totalDays = diff;
            if (!streakData.longestStreak || diff > streakData.longestStreak) {
                streakData.longestStreak = diff;
            }

            const stage = Math.floor(diff / 10) + 1;

            document.getElementById('streakDisplay').textContent = streakData.currentStreak;
            document.getElementById('longestDisplay').textContent = streakData.longestStreak;
            document.getElementById('totalDisplay').textContent = streakData.totalDays;
            document.getElementById('levelDisplay').textContent = stage;
            document.getElementById('streakDays').textContent = streakData.currentStreak;

            seedOrb.className = 'orb';
            if (stage === 1) seedOrb.classList.add('stage-1');
            else if (stage === 2) seedOrb.classList.add('stage-2');
            else seedOrb.classList.add('stage-3');

            renderWeekTracker();
            localStorage.setItem(STORAGE_KEYS.STREAK_DATA, JSON.stringify(streakData));
        }

        function renderWeekTracker() {
            const tracker = document.getElementById('weekTracker');
            tracker.innerHTML = '';
            const today = new Date();

            for (let i = 6; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const day = date.toLocaleDateString('en-US', { weekday: 'short' })[0];

                const dot = document.createElement('div');
                dot.className = 'day-dot';
                dot.textContent = day;

                if (i === 0) dot.classList.add('today');
                if (streakData.startDate && date >= new Date(streakData.startDate)) {
                    dot.classList.add('completed');
                }

                tracker.appendChild(dot);
            }
        }

        function handlePanic() {
            showToast('Take a deep breath. You\'ve got this. 💪');
        }

        function saveSettings() {
            const addiction = document.getElementById('addictionType').value;
            const startDate = document.getElementById('startDate').value;

            userProfile.addiction = addiction;
            if (startDate) {
                streakData.startDate = new Date(startDate).toISOString();
            }

            localStorage.setItem(STORAGE_KEYS.USER_PROFILE, JSON.stringify(userProfile));
            localStorage.setItem(STORAGE_KEYS.STREAK_DATA, JSON.stringify(streakData));

            updateDashboard();
            document.getElementById('settingsModal').classList.remove('active');
            showToast('Settings saved! 🎉');
        }

        function saveReminders() {
            const enabled = document.getElementById('enableReminders').checked;
            const time = document.getElementById('reminderTime').value;
            const message = document.getElementById('reminderMessage').value;

            localStorage.setItem(STORAGE_KEYS.REMINDERS, JSON.stringify({ enabled, time, message }));
            document.getElementById('notificationsModal').classList.remove('active');
            showToast('Reminders updated! 🔔');
        }

        function loadData() {
            const profile = localStorage.getItem(STORAGE_KEYS.USER_PROFILE);
            const streak = localStorage.getItem(STORAGE_KEYS.STREAK_DATA);
            const reminders = localStorage.getItem(STORAGE_KEYS.REMINDERS);

            if (profile) userProfile = JSON.parse(profile);
            if (streak) streakData = JSON.parse(streak);
            if (reminders) {
                const r = JSON.parse(reminders);
                document.getElementById('enableReminders').checked = r.enabled;
                document.getElementById('reminderTime').value = r.time;
                document.getElementById('reminderMessage').value = r.message;
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        init();
    </script>
</body>
</html>
